                map.set(key, asset);
            });
            return Array.from(map.values());
        };

        const syncAssetsWithTickets = (assetsList) => {
            // แยกข้อมูลพัสดุออกจากสถานะงานซ่อม ไม่อัปเดตสถานะตามตั๋วซ่อม
            return dedupeAssets(assetsList);
        };

        const resolveAttachmentSource = (source) => {
            if (!source) return null;
            if (typeof source === 'string') return source;
            if (typeof source === 'object') {
                if (typeof source.url === 'string' && source.url) return source.url;
                if (typeof source.src === 'string' && source.src) return source.src;
                if (typeof source.data === 'string' && source.data) return source.data;
            }
            return null;
        };

        const getTicketAttachments = (ticket = {}) => {
            if (!ticket) return [];
            const attachments = [];
            const appendAttachment = (source, label) => {
                const resolved = resolveAttachmentSource(source);
                if (!resolved) return;
                if (attachments.some(att => att.src === resolved)) return;
                attachments.push({ src: resolved, label });
            };

            appendAttachment(ticket.imageUrl, ticket.fileName || 'ภาพประกอบ');
            appendAttachment(ticket.fileUrl, ticket.fileName || 'ไฟล์แนบ');
            appendAttachment(ticket.image, ticket.fileName || 'ภาพประกอบ');
            appendAttachment(ticket.file, ticket.fileName || 'ไฟล์แนบ');
            appendAttachment(ticket.attachmentUrl, ticket.fileName || 'ไฟล์แนบ');

            if (Array.isArray(ticket.attachments)) {
                ticket.attachments.forEach((attachment) => {
                    appendAttachment(attachment, attachment.name || attachment.label);
                });
            }

            return attachments;
        };

        const StatusPopup = ({ message, visible }) => {
            if (!visible) return null;
            return (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center pointer-events-none">
                    <div className="pointer-events-auto bg-white/90 text-sm font-semibold text-gray-800 px-6 py-3 rounded-2xl border border-gray-200 shadow-lg shadow-gray-400/20 backdrop-blur">
                        {message}
                    </div>
                </div>
            );
        };

        // --- Main App Logic ---
        const App = () => {
            const [userRole, setUserRole] = useState('user'); // 'user' or 'admin'
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [view, setView] = useState('landing'); // 'landing', 'dashboard', 'list', 'calendar', 'settings', 'assets'
            const [tickets, setTickets] = useState([]);
            const [assets, setAssets] = useState([]);
            const [activityLog, setActivityLog] = useState([]);
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [loadingError, setLoadingError] = useState(null);

            const statusTimerRef = useRef(null);
            const [statusPopup, setStatusPopup] = useState({ visible: false, message: '' });

            const showStatusMessage = (message, autoHideMs) => {
                if (statusTimerRef.current) {
                    clearTimeout(statusTimerRef.current);
                    statusTimerRef.current = null;
                }
                setStatusPopup({ visible: true, message });
                if (autoHideMs) {
                    statusTimerRef.current = setTimeout(() => {
                        setStatusPopup({ visible: false, message: '' });
                        statusTimerRef.current = null;
                    }, autoHideMs);
                }
            };

            useEffect(() => {
                return () => {
                    if (statusTimerRef.current) {
                        clearTimeout(statusTimerRef.current);
                    }
                };
            }, []);

            const statusOverlay = <StatusPopup visible={statusPopup.visible} message={statusPopup.message} />;

            useEffect(() => {
                const fetchInitialData = async () => {
                    setIsLoadingData(true);
                    showStatusMessage('กำลังโหลดข้อมูล...');
                    try {
                        const initial = await runGoogleScript('getInitialData');
                        const normalizedTickets = (initial?.repairs || []).map(transformRepairRecord);
                        const normalizedAssets = (initial?.assets || []).map(transformAssetRecord);
                        setTickets(normalizedTickets);
                        setAssets(syncAssetsWithTickets(normalizedAssets, normalizedTickets));
                        setActivityLog(initial?.activityLog || []);
                        setLoadingError(null);
                        showStatusMessage('โหลดข้อมูลเสร็จสิ้น', 1500);
                    } catch (error) {
                        console.error('โหลดข้อมูลไม่สำเร็จ', error);
                        setLoadingError(error?.message || 'ไม่สามารถโหลดข้อมูลได้');
                        showStatusMessage('ไม่สามารถโหลดข้อมูลได้', 2000);
                        if (INITIAL_TICKETS?.length || INITIAL_ASSETS?.length) {
                            const fallbackTickets = INITIAL_TICKETS.map(transformRepairRecord);
                            const fallbackAssets = INITIAL_ASSETS.map(transformAssetRecord);
                            setTickets(fallbackTickets);
                            setAssets(syncAssetsWithTickets(fallbackAssets, fallbackTickets));
                        }
                    } finally {
                        setIsLoadingData(false);
                    }
                };
                fetchInitialData();
            }, []);

            const handleSubmitTicket = async (ticketPayload) => {
                showStatusMessage('กำลังบันทึกข้อมูลแจ้งซ่อม...');
                const payload = {
                    reporterName: ticketPayload.reporterName,
                    position: ticketPayload.position,
                    department: ticketPayload.department,
                    assetCode: ticketPayload.assetCode || ticketPayload.assetId || ticketPayload.serial || '',
                    assetId: ticketPayload.assetId || ticketPayload.assetCode || '',
                    assetName: ticketPayload.assetName || ticketPayload.itemName || ticketPayload.item || '',
                    itemName: ticketPayload.itemName || ticketPayload.item || '',
                    purchaseYear: ticketPayload.fiscalYear,
                    fiscalYear: ticketPayload.fiscalYear,
                    warrantyStatus: ticketPayload.warrantyStatus,
                    location: ticketPayload.location,
                    problemDetail: ticketPayload.issue,
                    issue: ticketPayload.issue,
                    contactType: ticketPayload.contactType || ticketPayload.contactRole,
                    contactName: ticketPayload.contactName,
                    phone: ticketPayload.phone,
                    urgency: ticketPayload.urgency,
                    image: ticketPayload.file ? { data: ticketPayload.file, name: ticketPayload.fileName || 'repair_image.jpg' } : undefined
                };

                try {
                    const response = await runGoogleScript('createRepair', payload);
                    const newTicket = transformRepairRecord(response?.repair || {});
                    setTickets(prevTickets => {
                        const nextTickets = [newTicket, ...prevTickets];
                        setAssets(prevAssets => syncAssetsWithTickets(prevAssets, nextTickets));
                        return nextTickets;
                    });
                    setView('tracking');
                    showStatusMessage('บันทึกแจ้งซ่อมเสร็จสิ้น', 1500);
                    return newTicket;
                } catch (error) {
                    console.error('ไม่สามารถสร้างแจ้งซ่อมได้', error);
                    showStatusMessage('ไม่สามารถบันทึกแจ้งซ่อมได้', 2000);
                    throw error;
                }
            };

            const handleLoginAdmin = () => {
                setUserRole('admin');
                setView('dashboard');
            };

            const handleLogout = () => {
                setUserRole('user');
                setView('landing');
            };

            const handleUpdateStatus = async (id, newStatus) => {
                showStatusMessage('กำลังอัปเดตสถานะงานซ่อม...');
                try {
                    const response = await runGoogleScript('updateRepairStatus', {
                        id,
                        newStatus: getStatusLabelFromId(newStatus)
                    });
                    const updatedTicket = transformRepairRecord(response?.repair || {});
                    setTickets(prevTickets => {
                        const nextTickets = prevTickets.map(t => t.id === id ? updatedTicket : t);
                        setAssets(prevAssets => syncAssetsWithTickets(prevAssets, nextTickets));
                        return nextTickets;
                    });
                    showStatusMessage('อัปเดตสถานะเสร็จสิ้น', 1500);
                } catch (error) {
                    console.error('ปรับสถานะไม่สำเร็จ', error);
                    showStatusMessage('อัปเดตสถานะไม่สำเร็จ', 2000);
                    alert(error?.message || 'ไม่สามารถอัปเดตสถานะได้');
                }
            };

            const handleCreateAsset = async (assetPayload) => {
                showStatusMessage('กำลังบันทึกพัสดุ...');
                try {
                    const response = await runGoogleScript('createAsset', assetPayload);
                    const newAsset = transformAssetRecord(response?.asset || assetPayload);
                    setAssets(prevAssets => {
                        const filtered = prevAssets.filter(a => a.assetKey !== newAsset.assetKey);
                        const nextAssets = [newAsset, ...filtered];
                        return syncAssetsWithTickets(nextAssets, tickets);
                    });
                    showStatusMessage('บันทึกพัสดุเสร็จสิ้น', 1500);
                } catch (error) {
                    console.error('เพิ่มพัสดุไม่สำเร็จ', error);
                    showStatusMessage('บันทึกพัสดุไม่สำเร็จ', 2000);
                    throw error;
                }
            };

            const handleUpdateAsset = async (assetPayload) => {
                showStatusMessage('กำลังอัปเดตข้อมูลพัสดุ...');
                try {
                    const response = await runGoogleScript('updateAsset', assetPayload);
                    const updatedAsset = transformAssetRecord(response?.asset || assetPayload);
                    setAssets(prevAssets => {
                        const targetKey = assetPayload?.assetKey
                            || buildAssetKey({
                                id: assetPayload?.id,
                                name: assetPayload?.originalName || assetPayload?.name,
                                brand: assetPayload?.brand
                            });
                        const nextAssets = prevAssets.map(asset => asset.assetKey === targetKey ? updatedAsset : asset);
                        return syncAssetsWithTickets(nextAssets, tickets);
                    });
                    showStatusMessage('อัปเดตพัสดุเสร็จสิ้น', 1500);
                } catch (error) {
                    console.error('แก้ไขพัสดุไม่สำเร็จ', error);
                    showStatusMessage('อัปเดตพัสดุไม่สำเร็จ', 2000);
                    throw error;
                }
            };

            const handleDeleteAsset = async (payload) => {
                showStatusMessage('กำลังลบพัสดุ...');
                try {
                    const assetPayload = typeof payload === 'string' ? { id: payload } : (payload || {});
                    await runGoogleScript('deleteAsset', assetPayload);
                    const removeKey = assetPayload.assetKey
                        || buildAssetKey({
                            id: assetPayload.id,
                            name: assetPayload.originalName || assetPayload.name,
                            brand: assetPayload.brand
                        });
                    setAssets(prevAssets => {
                        if (removeKey) {
                            return prevAssets.filter(a => a.assetKey !== removeKey);
                        }
                        return prevAssets.filter(a => a.id !== assetPayload.id);
                    });
                    showStatusMessage('ลบพัสดุเสร็จสิ้น', 1500);
                } catch (error) {
                    console.error('ลบพัสดุไม่สำเร็จ', error);
                    showStatusMessage('ลบพัสดุไม่สำเร็จ', 2000);
                    throw error;
                }
            };

            if (isLoadingData) {
                return (
                    <>
                        <div className="min-h-screen flex items-center justify-center bg-gray-50 text-gray-500">
                            <div className="text-center space-y-4">
                                <div className="w-14 h-14 border-4 border-gray-200 border-t-teal-500 rounded-full animate-spin mx-auto"></div>
                                <p>กำลังโหลดข้อมูล...</p>
                            </div>
                        </div>
                        {statusOverlay}
                    </>
                );
            }

            if (loadingError && tickets.length === 0 && assets.length === 0) {
                return (
                    <>
                        <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50 text-center px-6 text-gray-600 space-y-4">
                            <div className="text-5xl text-red-400"><i className="ph-wifi-slash"></i></div>
                            <p className="text-lg font-bold">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</p>
                            <p className="text-sm text-gray-500">{loadingError}</p>
                            <button
                                onClick={() => window.location.reload()}
                                className="px-6 py-3 bg-teal-500 text-white rounded-xl shadow hover:bg-teal-600 transition"
                            >
                                ลองใหม่อีกครั้ง
                            </button>
                        </div>
                        {statusOverlay}
                    </>
                );
            }

            if (view === 'landing' || view === 'tracking') {
                return (
                    <>
                        <UserPortal onSubmitTicket={handleSubmitTicket} onLoginAdmin={handleLoginAdmin} tickets={tickets} assets={assets} />
                        {statusOverlay}
                    </>
                );
            }

            return (
                <>
                    <div className="flex bg-gray-50 min-h-screen font-sans text-gray-800">
                        {/* Mobile Hamburger Button */}
                        <button
                            onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                            className="lg:hidden fixed top-4 left-4 z-50 w-12 h-12 bg-teal-500 hover:bg-teal-600 text-white rounded-full shadow-lg flex items-center justify-center transition-all"
                        >
                            <i className={`ph-${isSidebarOpen ? 'x' : 'list'} text-xl`}></i>
                        </button>

                        {/* Mobile Overlay */}
                        {isSidebarOpen && (
                            <div
                                className="lg:hidden fixed inset-0 bg-black/50 z-30"
                                onClick={() => setIsSidebarOpen(false)}
                            ></div>
                        )}

                        {/* Sidebar - Hidden on mobile, slide in when open */}
                        <div className={`fixed lg:static inset-y-0 left-0 z-40 transform transition-transform duration-300 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'
                            }`}>
                            <Sidebar currentView={view} setView={setView} onLogout={handleLogout} />
                        </div>

                        <main className="flex-1 lg:ml-20 p-8 transition-all duration-300">

                            {view === 'dashboard' && <DashboardView tickets={tickets} assets={assets} />}
                            {view === 'list' && <RepairListView tickets={tickets} onUpdateStatus={handleUpdateStatus} />}
                            {view === 'assets' && <AssetListView assets={assets} onDeleteAsset={handleDeleteAsset} onCreateAsset={handleCreateAsset} onUpdateAsset={handleUpdateAsset} tickets={tickets} />}
                            {view === 'calendar' && <CalendarView tickets={tickets} />}
                            {view === 'settings' && <SettingsView />}
                        </main>
                    </div>
                    {statusOverlay}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
