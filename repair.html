    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const STATUS_LABELS = {
            1: 'รับงาน',
            2: 'ตรวจสอบ',
            3: 'ดำเนินการซ่อม',
            4: 'เสร็จสิ้น',
            5: 'ยกเลิก'
        };

        const STATUS_ALIASES = {
            รับงาน: 1,
            งานใหม่: 1,
            'งานใหม่/รับงาน': 1,
            ตรวจสอบ: 2,
            'กำลังตรวจสอบ': 2,
            'ดำเนินการซ่อม': 3,
            'กำลังดำเนินการซ่อม': 3,
            'อยู่ระหว่างซ่อม': 3,
            'ส่งซ่อม': 3,
            เสร็จสิ้น: 4,
            สำเร็จ: 4,
            ปิดงาน: 4,
            ยกเลิก: 5,
            'ยกเลิกงาน': 5
        };

        const getStatusLabelFromId = (id) => STATUS_LABELS[id] || STATUS_LABELS[1];

        const getStatusIdFromLabel = (label = '') => {
            if (typeof label !== 'string') return 1;
            const clean = label.trim();
            return STATUS_ALIASES[clean] || 1;
        };

        const normalizeDateString = (value) => {
            if (!value) return '';
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) return '';
            return parsed.toISOString().split('T')[0];
        };

        const transformRepairRecord = (record = {}) => {
            const statusId = Number.isFinite(record.status)
                ? record.status
                : getStatusIdFromLabel(record.status);

            const normalizedDate = normalizeDateString(record.reportDate || record.date);
            return {
                id: record.id,
                item: record.assetName || record.item || record.itemName || 'ไม่ระบุ',
                serial: record.assetCode || record.serial || '',
                assetCode: record.assetCode || record.assetId || '',
                assetName: record.assetName || record.itemName || record.item || 'ไม่ระบุ',
                issue: record.problemDetail || record.issue || '',
                owner: record.reporterName || record.owner || '',
                department: record.department || '',
                date: normalizedDate,
                reportDate: record.reportDate || record.date || '',
                fiscalYear: record.purchaseYear || record.fiscalYear || '',
                location: record.location || '',
                warrantyStatus: record.warrantyStatus || '',
                urgency: record.urgency || '',
                contactName: record.contactName || '',
                contactRole: record.contactType || record.contactRole || '',
                phone: record.phone || '',
                status: statusId,
                statusLabel: record.status || getStatusLabelFromId(statusId),
                note: record.note || '',
                imageUrl: record.imageUrl || record.fileUrl || '',
                fileName: record.fileName || '',
                activityId: record.activityId || ''
            };
        };

        const buildAssetKey = (asset = {}) => {
            const idPart = normalizeString(asset.id);
            const namePart = normalizeString(asset.name);
            const brandPart = normalizeString(asset.brand);
            return [idPart, namePart, brandPart].filter(Boolean).join('::');
        };

        const transformAssetRecord = (asset = {}) => {
            const normalized = {
                id: asset.id,
                name: asset.name || 'ไม่ระบุ',
                brand: asset.brand || '',
                holder: asset.holder || '',
                department: asset.department || '',
                location: asset.location || '',
                purchaseYear: asset.purchaseYear || asset.fiscalYear || '',
                warrantyStatus: asset.warrantyStatus || '',
                status: asset.status || 'ปกติ',
                image: asset.image || asset.imageUrl || '',
                imageFileId: asset.imageFileId || '',
                note: asset.note || ''
            };

            return {
                ...normalized,
                assetKey: asset.assetKey || buildAssetKey(normalized),
                originalName: asset.originalName || normalized.name
            };
        };

        const runGoogleScript = (functionName, payload) => {
            return new Promise((resolve, reject) => {
                const runner = window?.google?.script?.run;
                if (!runner) {
                    reject(new Error('ไม่สามารถเชื่อมต่อ Google Apps Script ได้'));
                    return;
                }
                try {
                    runner
                        .withSuccessHandler(resolve)
                        .withFailureHandler((error) => {
                            if (typeof error === 'string') {
                                reject(new Error(error));
                            } else if (error && error.message) {
                                reject(new Error(error.message));
                            } else {
                                reject(error || new Error('เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ'));
                            }
                        })[functionName](payload);
                } catch (err) {
                    reject(err);
                }
            });
        };

        const printPdfFromBase64 = (base64, label = 'PDF') => {
            if (!base64) return;
            const binary = atob(base64);
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const iframe = document.createElement('iframe');
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = 'none';
            iframe.style.position = 'fixed';
            iframe.style.left = '-9999px';
            iframe.setAttribute('aria-hidden', 'true');
            iframe.onload = () => {
                const win = iframe.contentWindow;
                win?.focus();
                win?.print();
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    iframe.remove();
                }, 200);
            };
            iframe.src = url;
            document.body.appendChild(iframe);
        };

        // --- Data & Helpers ---
        const STEPS = [
            { id: 1, label: 'รับงาน', icon: 'ph-clipboard-text', color: 'text-gray-500', bg: 'bg-gray-100' },
            { id: 2, label: 'ตรวจสอบ', icon: 'ph-magnifying-glass', color: 'text-yellow-500', bg: 'bg-yellow-100' },
            { id: 3, label: 'ดำเนินการซ่อม', icon: 'ph-wrench', color: 'text-blue-500', bg: 'bg-blue-100' },
            { id: 4, label: 'เสร็จสิ้น', icon: 'ph-check-circle', color: 'text-green-500', bg: 'bg-green-100' },
            { id: 5, label: 'ยกเลิก', icon: 'ph-x-circle', color: 'text-red-500', bg: 'bg-red-100' }
        ];

        const getStatusMeta = (id) => {
            switch (id) {
                case 1: return { color: 'bg-gray-500', bg: 'bg-gray-100', text: 'text-gray-600', icon: 'ph-clipboard-text' };
                case 2: return { color: 'bg-yellow-500', bg: 'bg-yellow-100', text: 'text-yellow-600', icon: 'ph-magnifying-glass' };
                case 3: return { color: 'bg-blue-500', bg: 'bg-blue-100', text: 'text-blue-600', icon: 'ph-wrench' };
                case 4: return { color: 'bg-green-500', bg: 'bg-green-100', text: 'text-green-600', icon: 'ph-check-circle' };
                case 5: return { color: 'bg-red-500', bg: 'bg-red-100', text: 'text-red-600', icon: 'ph-x-circle' };
                default: return {};
            }
        };

        const normalizeString = (value) => {
            if (value === undefined || value === null) return '';
            return String(value).trim().toLowerCase();
        };

        const getTicketMatchName = (ticket) => {
            return normalizeString(ticket?.assetName || ticket?.asset || ticket?.itemName || ticket?.item);
        };

        const ACTIVE_REPAIR_STATUSES = new Set([1, 2, 3]);

        const matchesTicketToAsset = (asset, ticket) => {
            if (!asset || !ticket) return false;

            const assetId = normalizeString(asset.id);
            const ticketCode = normalizeString(ticket.assetCode || ticket.assetId || ticket.serial);

            if (!assetId || !ticketCode) return false;
            return assetId === ticketCode;
        };

        const escapeHtml = (value) => {
            if (value === undefined || value === null) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/\r?\n/g, '<br/>');
        };

        // Helper function to get date relative to today
        const getRelativeDate = (offset) => {
            const date = new Date();
            date.setDate(date.getDate() + offset);
            return date.toISOString().split('T')[0];
        };

        const getStartOfWeek = () => {
            const d = new Date();
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        };

        // Mock data adjusted to allow for weekly chart visualization relative to "Today"
        const INITIAL_TICKETS = [
            {

                urgency: 'ปานกลาง', department: 'อำนวยการ', warrantyStatus: 'หมดระยะรับประกัน', phone: '081-111-2222', contactName: 'สมชาย'
            },

                urgency: 'เร่งด่วน', department: 'ส่งเสริมกิจการและหารายได้', warrantyStatus: 'อยู่ในระยะรับประกัน', phone: '02-555-6666', contactName: 'คุณหญิง'

                urgency: 'สูง', department: 'วิชาการและการเรียนรู้', warrantyStatus: 'อยู่ในระยะรับประกัน', phone: '089-999-8888', contactName: 'Admin'
            },
            {
                id: 'RQ-005', item: 'โปรเจคเตอร์', serial: 'PJ-002', location: 'ห้องประชุมเล็ก', issue: 'ภาพเป็นเส้น', status: 1, date: getRelativeDate(0), owner: 'ฝ่ายบุคคล',
                urgency: 'ปานกลาง', department: 'อำนวยการ', warrantyStatus: 'หมดระยะรับประกัน', phone: '-', contactName: '-'

        // --- Settings View - Simplified Version ---
        const SettingsView = () => {
            const loadSettings = () => {
                try {
                    const saved = localStorage.getItem('repairSystemSettings');
                    if (saved) return JSON.parse(saved);
                } catch (error) {
                    console.error('Error loading settings:', error);
                }
                return {
                    lineNotifyEnabled: false,
                    lineNotifyToken: '',
                    lineNotifyGroupId: ''
                };
            };

            const [settings, setSettings] = useState(loadSettings());
            const [savedSettings, setSavedSettings] = useState(loadSettings());

            const handleChange = (field, value) => {
                setSettings(prev => ({ ...prev, [field]: value }));
            };

            const handleSave = () => {
                try {
                    localStorage.setItem('repairSystemSettings', JSON.stringify(settings));
                    setSavedSettings(settings);
                    alert('ตั้งค่าการแจ้งเตือน Line ถูกบันทึกแล้ว');
                } catch (error) {
                    console.error('Error saving settings:', error);
                    alert('เกิดข้อผิดพลาดในการบันทึก');

            const handleSubmit = (e) => {
                e.preventDefault();

            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-enter">
                        <div className="bg-teal-500 p-6 text-center relative overflow-hidden">
                            <button onClick={onClose} className="absolute top-4 right-4 text-white/70 hover:text-white transition"><i className="ph-x text-xl"></i></button>
                            <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3 text-white text-3xl"><i className="ph-lock-key"></i></div>
                            <h3 className="text-xl font-bold text-white">ผู้ดูแลระบบ</h3>
                            <p className="text-teal-100 text-xs">Admin Access</p>
                        </div>
                        <div className="p-6">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Username</label>
                                    <input type="text" autoFocus className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-teal-400 focus:bg-white transition"
                                        value={username} onChange={e => setUsername(e.target.value)} placeholder="ชื่อผู้ใช้งาน" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Password</label>
                                    <input type="password" className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-teal-400 focus:bg-white transition"
                                        value={password} onChange={e => setPassword(e.target.value)} placeholder="รหัสผ่าน" />
                                </div>
                                <button type="submit" className="w-full bg-teal-500 text-white font-bold py-3 rounded-xl hover:bg-teal-600 shadow-lg shadow-teal-500/30 hover:-translate-y-1 transition-all">เข้าสู่ระบบ</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const UserPortal = ({ onSubmitTicket, onLoginAdmin, tickets, assets }) => {
            const [mode, setMode] = useState('landing');
            const [showLogin, setShowLogin] = useState(false);
            const [filteredAssets, setFilteredAssets] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const qrVideoRef = useRef(null);
            const qrScannerRef = useRef(null);
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const [scannerError, setScannerError] = useState('');

            const handleAdminLogin = (username, password) => {
                if (username === 'Admin' && password === 'admin123') {
                    onLoginAdmin();
                    setShowLogin(false);
                } else {
                    alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                }
            };

            const autofillAssetFields = (assetId) => {
                if (!assetId) return null;
                const normalized = assetId.trim().toLowerCase();
                return assets.find(asset => asset.id?.toLowerCase() === normalized || asset.id?.toLowerCase().includes(normalized));
            };

            const handleScanResult = (result) => {
                const scannedValue = (result || '').trim();
                if (!scannedValue) return;

                const matchedAsset = autofillAssetFields(scannedValue);

                setFormData(prev => ({
                    ...prev,
                    assetId: matchedAsset?.id || scannedValue,
                    itemName: matchedAsset?.name || prev.itemName,
                    fiscalYear: matchedAsset?.purchaseYear || matchedAsset?.fiscalYear || prev.fiscalYear,
                    location: matchedAsset?.location || prev.location,
                    warrantyStatus: matchedAsset?.warrantyStatus || prev.warrantyStatus
                }));

                setShowSuggestions(false);
                setIsScannerOpen(false);
                qrScannerRef.current?.stop();
            };

            const startScanner = () => {
                if (!window?.QrScanner) {
                    setScannerError('อุปกรณ์นี้ไม่รองรับการสแกน QR');
                    return;
                }
                setScannerError('');
                setIsScannerOpen(true);
            };

            const stopScanner = () => {
                qrScannerRef.current?.stop();
                setIsScannerOpen(false);
            };

            useEffect(() => {
                if (!isScannerOpen) return;
                let active = true;
                const initScanner = async () => {
                    if (!window?.QrScanner) {
                        setScannerError('อุปกรณ์นี้ไม่รองรับการสแกน QR');
                        setIsScannerOpen(false);
                        return;
                    }
                    if (!qrVideoRef.current) {
                        setScannerError('ไม่พบกล้อง');
                        setIsScannerOpen(false);
                        return;
                    }
                    if (!qrScannerRef.current) {
                        qrScannerRef.current = new window.QrScanner(qrVideoRef.current, result => {
                            handleScanResult(result?.data || result);
                        }, {
                            highlightScanRegion: true,
                            highlightCodeOutline: true
                        });
                    }

                    try {
                        await qrScannerRef.current.start();
                    } catch (error) {
                        console.error(error);
                        if (active) {
                            setScannerError('ไม่สามารถเปิดกล้องสแกนได้');
                            setIsScannerOpen(false);
                        }
                    }
                };

                initScanner();

                return () => {
                    active = false;
                    qrScannerRef.current?.stop();
                };
            }, [isScannerOpen]);

            useEffect(() => {
                return () => {
                    qrScannerRef.current?.stop();
                    qrScannerRef.current?.destroy();
                };
            }, []);

            const activeTickets = tickets.filter(t => t.status < 4).sort((a, b) => new Date(b.date) - new Date(a.date));

            const [formData, setFormData] = useState({
                reporterName: '',
                position: '',
                department: '',
                assetId: '',
                itemName: '',
                fiscalYear: '',
                warrantyStatus: '',
                location: '',
                issue: '',
                contactRole: '',
                contactName: '',
                phone: '',
                urgency: '',
                file: null,      // New file state
                fileName: '',    // Store filename
                fileSize: ''     // Store size string
            });
            const [isDragging, setIsDragging] = useState(false);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitError, setSubmitError] = useState(null);
            // --- Auto-Complete Logic ---
            const handleAssetSearch = (value) => {
                setFormData({ ...formData, assetId: value });
                if (value.length > 0 && assets) {
                    const filtered = assets.filter(a =>
                        a.id.toLowerCase().includes(value.toLowerCase()) ||
                        a.name.toLowerCase().includes(value.toLowerCase())
                    );
                    setFilteredAssets(filtered);
                    setShowSuggestions(true);
                } else {
                    setShowSuggestions(false);
                }
            };

            const selectAsset = (asset) => {
                const isWarrantyActive = new Date(asset.warrantyDate) >= new Date();
                setFormData({
                    ...formData,
                    assetId: asset.id,
                    itemName: asset.name,
                    fiscalYear: asset.purchaseYear || asset.fiscalYear || '',
                    location: asset.location,
                    warrantyStatus: isWarrantyActive ? 'อยู่ในประกัน' : 'หมดประกัน'
                });
                setShowSuggestions(false);
            };

            // --- File Upload Helpers ---
            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                validateAndSetFile(file);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragging(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setIsDragging(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                const file = e.dataTransfer.files[0];
                validateAndSetFile(file);
            };

            const validateAndSetFile = (file) => {
                if (!file) return;

                // Validate Type
                const validTypes = ['image/jpeg', 'image/png', 'image/gif'];
                if (!validTypes.includes(file.type)) {
                    alert("กรุณาอัปโหลดไฟล์รูปภาพ (PNG, JPG, GIF) เท่านั้น");
                    return;
                }

                // Validate Size (10MB)
                const maxSize = 10 * 1024 * 1024;
                if (file.size > maxSize) {
                    alert("ขนาดไฟล์ต้องไม่เกิน 10MB");
                    return;
                }

                // Generate Preview
                const reader = new FileReader();
                reader.onloadend = () => {
                    setPreviewUrl(reader.result);
                    setFormData(prev => ({
                        ...prev,
                        file: reader.result, // base64 string for now
                        fileName: file.name,
                        fileSize: (file.size / 1024 / 1024).toFixed(2) + ' MB'
                    }));
                };
                reader.readAsDataURL(file);
            };

            const removeFile = () => {
                setPreviewUrl(null);
                setFormData(prev => ({ ...prev, file: null, fileName: '', fileSize: '' }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const requiredFields = [
                    { key: 'reporterName', label: 'ชื่อผู้แจ้งซ่อม' },
                    { key: 'position', label: 'ตำแหน่ง' },
                    { key: 'department', label: 'กลุ่มงาน' },
                    { key: 'assetId', label: 'หมายเลขครุภัณฑ์' },
                    { key: 'itemName', label: 'รายการวัสดุ/ครุภัณฑ์' },
                    { key: 'fiscalYear', label: 'ปีงบประมาณ' },
                    { key: 'location', label: 'สถานที่ตั้ง' },
                    { key: 'issue', label: 'อาการ/ปัญหา' }
                ];
                const missing = requiredFields.find(field => {
                    const value = formData[field.key];
                    return !value || String(value).trim().length === 0;
                });
                if (missing) {
                    alert(`กรุณากรอกข้อมูล "${missing.label}" ก่อนส่งแจ้งซ่อม`);
                    return;
                }
                if (!formData.file) {
                    alert('กรุณาแนบรูปภาพพัสดุเพื่อยืนยันอาการก่อนบันทึกแจ้งซ่อม');
                    return;
                }

                const fullTicketData = {
                    reporterName: formData.reporterName,
                    position: formData.position,
                    department: formData.department,
                    assetCode: formData.assetId,
                    assetId: formData.assetId,
                    assetName: formData.itemName,
                    itemName: formData.itemName,
                    item: formData.itemName || 'อุปกรณ์ทั่วไป',
                    serial: formData.assetId,
                    location: formData.location,
                    issue: formData.issue,
                    owner: formData.reporterName || 'ผู้ใช้งานทั่วไป',
                    fiscalYear: formData.fiscalYear,
                    warrantyStatus: formData.warrantyStatus,
                    urgency: formData.urgency,
                    contactName: formData.contactName,
                    phone: formData.phone,
                    contactRole: formData.contactRole,
                    contactType: formData.contactRole,
                    file: formData.file,
                    fileName: formData.fileName,
                    fileSize: formData.fileSize
                };

                setIsSubmitting(true);
                setSubmitError(null);
                try {
                    await onSubmitTicket(fullTicketData);
                    setFormData({
                        reporterName: '', position: '', department: '',
                        assetId: '', itemName: '', fiscalYear: '', warrantyStatus: '',
                        location: '', issue: '', contactRole: '', contactName: '', phone: '', urgency: '',
                        file: null, fileName: '', fileSize: ''
                    });
                    setPreviewUrl(null);
                    setIsDragging(false);
                    alert("บันทึกข้อมูลแจ้งซ่อมเรียบร้อยแล้ว");
                    setMode('tracking');
                } catch (error) {
                    console.error(error);
                    setSubmitError(error?.message || 'ไม่สามารถบันทึกข้อมูลได้');
                    alert(error?.message || 'ไม่สามารถบันทึกข้อมูลได้');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-cyan-50 to-blue-50 flex flex-col items-center justify-center p-4 relative animate-fade" >
                    <LoginModal isOpen={showLogin} onClose={() => setShowLogin(false)} onLogin={handleAdminLogin} />

                    <div className="mb-8 text-center">
                        <div className="w-20 h-20 bg-gradient-to-tr from-teal-400 to-blue-500 rounded-3xl mx-auto flex items-center justify-center shadow-lg shadow-teal-500/30 mb-4 text-white text-4xl"><i className="ph-wrench"></i></div>
                        <h1 className="text-3xl font-bold text-gray-800">Repair<span className="text-teal-500">Hub</span></h1>
                        <p className="text-gray-500">ระบบแจ้งซ่อมครุภัณฑ์ออนไลน์</p>
                    </div>

                    {mode === 'landing' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl">
                            <div onClick={() => setMode('form')} className="bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:-translate-y-2 transition-all cursor-pointer group border border-transparent hover:border-teal-200">
                                <div className="w-14 h-14 bg-teal-100 text-teal-600 rounded-2xl flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition-transform"><i className="ph-plus-circle"></i></div>
                                <h2 className="text-xl font-bold text-gray-800 mb-2">แจ้งซ่อมใหม่</h2>
                                <p className="text-gray-500 text-sm">แจ้งปัญหาอุปกรณ์เสีย หรือขอรับบริการซ่อมบำรุง</p>
                            </div>
                            <div onClick={() => setMode('tracking')} className="bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:-translate-y-2 transition-all cursor-pointer group border border-transparent hover:border-blue-200 relative overflow-hidden">
                                {activeTickets.length > 0 && <div className="absolute top-4 right-4 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full animate-bounce">{activeTickets.length} งานค้าง</div>}
                                <div className="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition-transform"><i className="ph-list-dashes"></i></div>
                                <h2 className="text-xl font-bold text-gray-800 mb-2">ติดตามสถานะ</h2>
                                <p className="text-gray-500 text-sm">ตรวจสอบงานซ่อมที่กำลังดำเนินการ (Real-time)</p>
                            </div>
                        </div>
                    )}

                    {mode === 'form' && (
                        <div className="bg-white p-4 md:p-8 rounded-3xl shadow-xl w-full max-w-4xl animate-enter relative">
                            {/* Back Button - Icon only on mobile */}
                            <button
                                onClick={() => setMode('landing')}
                                className="absolute top-4 left-4 md:top-6 md:left-6 w-10 h-10 md:w-auto md:h-auto flex items-center justify-center md:justify-start text-gray-400 hover:text-gray-600 bg-gray-100 md:bg-transparent rounded-full md:rounded-none transition-all z-10"
                                title="ย้อนกลับ"
                            >
                                <i className="ph-arrow-left text-xl"></i>
                                <span className="hidden md:inline ml-2">ย้อนกลับ</span>
                            </button>

                            {/* Header with proper spacing for back button */}
                            <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-6 text-center pl-12 md:pl-0">แบบฟอร์มแจ้งซ่อม</h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">ชื่อผู้แจ้งซ่อม</label>
                                        <input className="w-full bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-teal-400 outline-none input-equal-height px-3"
                                            placeholder="นายชำรุด ต้องการซ่อมแซม"
                                            value={formData.reporterName} onChange={e => setFormData({ ...formData, reporterName: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">ตำแหน่ง</label>
                                        <select className="w-full bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-teal-400 outline-none input-equal-height px-3 text-gray-500"
                                            value={formData.position} onChange={e => setFormData({ ...formData, position: e.target.value })}>
                                            <option value="">เลือกตำแหน่ง...</option>
                                            <option value="เจ้าหน้าที่บรรจุ">เจ้าหน้าที่บรรจุ</option>
                                            <option value="เจ้าหน้าที่สนับสนุน">เจ้าหน้าที่สนับสนุน</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">กลุ่มงาน</label>
                                    <select className="w-full bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-teal-400 outline-none input-equal-height px-3 text-gray-500"
                                        value={formData.department} onChange={e => setFormData({ ...formData, department: e.target.value })}>
                                        <option value="">เลือกกลุ่มงาน...</option>
                                        <option value="อำนวยการ">อำนวยการ</option>
                                        <option value="วิชาการและการเรียนรู้">วิชาการและการเรียนรู้</option>
                                        <option value="ส่งเสริมกิจการและหารายได้">ส่งเสริมกิจการและหารายได้</option>
                                        <option value="ดูแลบำรุงรักษาสวนและโครงสร้างพื้นฐาน">ดูแลบำรุงรักษาสวนและโครงสร้างพื้นฐาน</option>
                                    </select>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="relative">
                                        <label className="block text-sm font-bold text-gray-700 mb-1">หมายเลขครุภัณฑ์ <span className="text-red-500">*</span></label>
                                        <div className="relative">
                                            <div className="flex items-center gap-2">
                                                <i className="ph-barcode absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                                                <input
                                                    required
                                                    className="flex-1 pl-10 bg-gray-50 border border-gray-200 rounded-xl pr-4 py-3 outline-none focus:ring-2 focus:ring-teal-400 transition"
                                                    placeholder="ระบุหมายเลขครุภัณฑ์ (เช่น 68-1-13-01/09)"
                                                    value={formData.assetId}
                                                    onChange={e => handleAssetSearch(e.target.value)}
                                                    onFocus={() => formData.assetId && setShowSuggestions(true)}
                                                    onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
                                                />
                                                <button
                                                    type="button"
                                                    onClick={startScanner}
                                                    className="px-3 py-2 bg-blue-500 text-white text-xs rounded-xl shadow-md hover:bg-blue-600 transition h-fit flex items-center gap-1"
                                                >
                                                    <i className="ph-qrcode text-base"></i>
                                                    สแกน QR
                                                </button>
                                            </div>
                                            {showSuggestions && filteredAssets.length > 0 && (
                                                <div className="absolute z-10 w-full bg-white mt-1 border border-gray-100 rounded-xl shadow-lg max-h-48 overflow-y-auto">
                                                    {filteredAssets.map(asset => (
                                                        <div
                                                            key={asset.assetKey || asset.id}
                                                            onClick={() => selectAsset(asset)}
                                                            className="p-3 hover:bg-teal-50 cursor-pointer border-b border-gray-50 last:border-0"
                                                        >
                                                            <div className="font-bold text-teal-600 text-sm">{asset.id}</div>
                                                            <div className="text-xs text-gray-500">{asset.name}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        <p className="text-xs text-gray-400 mt-1">พิมพ์เพื่อค้นหาพัสดุอัตโนมัติ</p>
                                        {scannerError && (
                                            <p className="text-[11px] text-red-500 mt-2">{scannerError}</p>
                                        )}
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">รายการวัสดุ/ครุภัณฑ์(ระบุ) <span className="text-red-500">*</span></label>
                                        <input required className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-teal-400 transition" value={formData.itemName} onChange={e => setFormData({ ...formData, itemName: e.target.value })} placeholder="เช่น เครื่องพิมพ์, คอมพิวเตอร์" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">ซื้อในปีงบประมาณ พ.ศ. <span className="text-red-500">*</span></label>
                                        <input required className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-teal-400 transition" value={formData.fiscalYear} onChange={e => setFormData({ ...formData, fiscalYear: e.target.value })} placeholder="2569 (เลข 2 ตัวแรก หมายเลขครุภัณฑ์)" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">สถานะประกัน</label>
                                        <select className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-teal-400 transition" value={formData.warrantyStatus} onChange={e => setFormData({ ...formData, warrantyStatus: e.target.value })}>
                                            <option value="">โปรดระบุ</option>
                                            <option value="อยู่ในประกัน">อยู่ในประกัน</option>
                                            <option value="หมดประกัน">หมดประกัน</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">สถานที่ตั้ง <span className="text-red-500">*</span></label>
                                        <input required className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-teal-400 transition" value={formData.location} onChange={e => setFormData({ ...formData, location: e.target.value })} />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">ลักษณะอาการชำรุด/ปัญหา <span className="text-red-500">*</span></label>
                                    <textarea className="w-full bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-teal-400 outline-none input-equal-height px-3 resize-none overflow-hidden pt-3"
                                        placeholder="เปิดไม่ติด,ไดร์ท:Cเต็ม,คีบอร์ด/เมาท์เสีย"

            // Helper to get start/end dates for predefined filters
            const getFilterDateRange = (type) => {
                const today = new Date();
                const start = new Date(today);
                const end = new Date(today);

                if (type === 'today') {
                    // Start and end are today
                } else if (type === 'week') {
                    const day = today.getDay();
                    const diff = today.getDate() - day + (day === 0 ? -6 : 1); // Monday
                    start.setDate(diff);
                    end.setDate(start.getDate() + 6);
                } else if (type === 'month') {
                    start.setDate(1);
                    end.setMonth(today.getMonth() + 1);
                    end.setDate(0);
                }
                return {
                    start: start.toISOString().split('T')[0],
                    end: end.toISOString().split('T')[0]
                };
            };

                if (filter === 'all') return tickets;

                if (filter === 'custom') {

                    end = customRange.end;
                } else {
                    const range = getFilterDateRange(filter);
                    start = range.start;
                    end = range.end;

        const AssetQrPanel = ({ asset }) => {
            const qrPreviewRef = useRef(null);

            useEffect(() => {
                if (!asset?.id || !window?.QRCode || !qrPreviewRef.current) return;
                qrPreviewRef.current.innerHTML = '';
                new window.QRCode(qrPreviewRef.current, {
                    text: `${asset.id}`,
                    width: 220,
                    height: 220,
                    correctLevel: window.QRCode?.CorrectLevel?.H
                });
            }, [asset]);

            const handlePrint = () => {
                const canvas = qrPreviewRef.current?.querySelector('canvas');
                const imgData = canvas?.toDataURL('image/png');
                if (!imgData) {
                    alert('ไม่พบ QR Code ที่จะพิมพ์');
                    return;
                }
                const printWindow = window.open('', '_blank');
                if (!printWindow) {
                    alert('ไม่สามารถเปิดหน้าต่างการพิมพ์ได้');
                    return;
                }
                const content = `
                    <html>
                        <head><title>QR Code</title></head>
                        <body style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sarabun, sans-serif;">
                            <h3>QR Code: ${asset.id || 'ไม่ระบุ'}</h3>
                            <img src="${imgData}" alt="QR Code" style="width:220px;height:220px;" />
                            <p class="text-[12px] text-gray-900 font-semibold mt-3 mb-0">${asset.name || 'ครุภัณฑ์'}</p>
                            <p class="text-[11px] text-gray-600 mb-0">${asset.brand || ''}</p>
                            <p class="text-[11px] text-gray-600 mb-0">${asset.holder || 'ไม่ระบุผู้ครอบครอง'}</p>
                            <p class="text-[11px] text-gray-500 mt-0">${asset.location || 'ไม่ระบุที่ตั้ง'}</p>
                            <script>
                                window.onload = () => {
                                    window.print();
                                    window.onafterprint = () => window.close();
                                };
                            </scr` + `ipt>
                        </body>
                    </html>
                `;
                printWindow.document.write(content);
            };

            return (
                <div className="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm text-center">
                    <h4 className="text-sm font-semibold text-gray-600 mb-2">QR Code พัสดุ</h4>
                    <div ref={qrPreviewRef} className="w-full flex items-center justify-center mb-3 h-[220px]"></div>
                    <p className="text-[11px] text-gray-400 mb-3">
                        สแกนเพื่อตรวจสอบข้อมูลครุภัณฑ์หรือพกไปติดตั้ง
                    </p>
                    <button
                        onClick={handlePrint}
                        className="px-4 py-2 bg-gradient-to-r from-teal-500 to-cyan-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-teal-500/30 hover:shadow-teal-500/60 transition"
                    >
                        พิมพ์ QR Code
                    </button>

        };

        const AssetEditModal = ({ asset, isOpen, onClose, onSave, existingAssets = [] }) => {
            const [formData, setFormData] = useState({
                idCodeYear: '68',
                idCodeCat: '1-13-01',
                idCodeSeq: '',
                name: '',
                brand: '',
                holder: '',
                department: '',
                location: '',
                purchaseYear: '',
                warrantyStatus: 'อยู่ในประกัน',
                status: 'ปกติ',
                image: ''

            const [isSaving, setIsSaving] = useState(false);
            const [imageFile, setImageFile] = useState(null);
            const [imagePreview, setImagePreview] = useState('');
            const [imageBase64, setImageBase64] = useState('');
            const [isImageDragging, setIsImageDragging] = useState(false);

            const normalizeSequence = (value) => {
                const digits = String(value || '').replace(/\D/g, '');
                const parsed = parseInt(digits, 10);
                if (Number.isNaN(parsed)) return '001';
                const clamped = Math.min(Math.max(parsed, 1), 999);
                return String(clamped).padStart(3, '0');
            };

            const nextSequence = useMemo(() => {
                const yearValue = (formData.idCodeYear || '').trim();
                const categoryValue = (formData.idCodeCat || '').trim();
                if (!yearValue || !categoryValue) return '001';
                const prefix = `${yearValue}-${categoryValue}/`;
                const collected = existingAssets
                    .map(existing => existing.id)
                    .filter(id => id.startsWith(prefix))
                    .map(id => {
                        const seqPart = id.split('/').pop();
                        const parsed = parseInt(seqPart, 10);
                        return Number.isNaN(parsed) ? 0 : parsed;
                    })
                    .filter(num => num > 0);
                const highestSeq = collected.length ? Math.max(...collected) : 0;
                return normalizeSequence(String(highestSeq + 1));
            }, [formData.idCodeYear, formData.idCodeCat, existingAssets]);

            // Initialize form data when asset changes or modal opens
            useEffect(() => {
                if (isOpen) {
                    if (asset) {
                        setFormData({
                            ...asset,
                            isEdit: true
                        });
                        setImagePreview(asset.image || '');
                    } else {
                        setFormData({
                            idCodeYear: '68',
                            idCodeCat: '1-13-01',
                            idCodeSeq: '',
                            name: '',
                            brand: '',
                            holder: '',
                            department: '',
                            location: '',
                            purchaseYear: new Date().getFullYear() + 543 + '',
                            warrantyStatus: 'อยู่ในประกัน',
                            status: 'ปกติ',
                            image: '',
                            isEdit: false
                        });
                        setImagePreview('');
                    }
                    setImageFile(null);
                    setImageBase64('');
                    setIsImageDragging(false);
                }
            }, [asset, isOpen]);

            useEffect(() => {
                if (!asset && isOpen && nextSequence) {
                    setFormData(prev => {
                        if (!prev.idCodeSeq || prev.idCodeSeq === nextSequence) {
                            return { ...prev, idCodeSeq: nextSequence };
                        }
                        return prev;
                    });
                }
            }, [asset, isOpen, nextSequence]);

            const imageInputRef = useRef(null);

            const handleImageFileUpload = (file) => {
                if (!file) return;
                const validTypes = ['image/jpeg', 'image/png', 'image/gif'];
                if (!validTypes.includes(file.type)) {
                    alert('รองรับเฉพาะไฟล์รูปภาพ PNG, JPG, GIF เท่านั้น');
                    return;
                }
                const maxSize = 10 * 1024 * 1024;
                if (file.size > maxSize) {
                    alert('ขนาดไฟล์รูปภาพต้องไม่เกิน 10MB');
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    setImagePreview(reader.result);
                    setImageBase64(reader.result);
                    setImageFile(file);
                };
                reader.readAsDataURL(file);
            };

            const handleImageInputChange = (event) => {
                const file = event.target.files?.[0];
                handleImageFileUpload(file);
            };

            const handleImageDragOver = (event) => {
                event.preventDefault();
                setIsImageDragging(true);
            };

            const handleImageDragLeave = (event) => {
                event.preventDefault();
                setIsImageDragging(false);
            };

            const handleImageDrop = (event) => {
                event.preventDefault();
                setIsImageDragging(false);
                const file = event.dataTransfer.files?.[0];
                handleImageFileUpload(file);
            };

            const handleRemoveImage = () => {
                setImagePreview('');
                setImageBase64('');
                setImageFile(null);
                if (imageInputRef.current) {
                    imageInputRef.current.value = '';
                }
            };

            if (!isOpen) return null;

            const handleChange = (e) => {
                let { name, value } = e.target;
                if (name === 'idCodeSeq') {
                    value = value.replace(/\D/g, '').slice(0, 3);
                }
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                // Construct ID for new assets
                let finalId = asset?.id;
                if (!asset) {
                    const yearPart = ((formData.idCodeYear || '00').trim() || '00').padStart(2, '0');
                    const categoryPart = (formData.idCodeCat || '00-00-00').trim().replace(/\s+/g, '');
                    const seqForId = normalizeSequence(formData.idCodeSeq || nextSequence);
                    finalId = `${yearPart}-${categoryPart}/${seqForId}`;
                }

                // Construct full asset object
                const imageUploadPayload = imageBase64 ? {
                    data: imageBase64,
                    name: imageFile?.name || `${finalId}.jpg`
                } : undefined;

                const finalAsset = {
                    id: finalId,
                    name: formData.name,
                    brand: formData.brand,
                    holder: formData.holder,
                    department: formData.department,
                    location: formData.location,
                    purchaseYear: formData.purchaseYear,
                    warrantyStatus: formData.warrantyStatus,
                    status: formData.status,
                    image: imagePreview || asset?.image || '',
                    imageUpload: imageUploadPayload,
                    originalName: asset?.originalName || asset?.name || '',
                    assetKey: asset?.assetKey
                };

                setIsSaving(true);
                try {
                    await onSave(finalAsset, { isEdit: Boolean(asset) });
                    onClose();
                } catch (error) {
                    console.error(error);
                    alert(error?.message || 'ไม่สามารถบันทึกข้อมูลพัสดุได้');
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade">
                    <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden">
                        <div className="bg-gradient-to-r from-teal-500 to-teal-600 px-6 py-4 flex justify-between items-center text-white">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <i className={`ph-${asset ? 'pencil' : 'plus-circle'}`}></i>
                                {asset ? 'แก้ไขข้อมูลพัสดุ' : 'เพิ่มพัสดุใหม่'}
                            </h2>
                            <button onClick={onClose} className="bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
                                <i className="ph-x text-lg"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6 md:p-8 max-h-[80vh] overflow-y-auto">
                            {/* ID Creation Section - Only for New Assets */}
                            {!asset && (
                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6">
                                    <label className="block text-blue-800 text-sm font-bold mb-3 uppercase flex items-center gap-2">
                                        <i className="ph-barcode"></i> กำหนดรหัสพัสดุ
                                    </label>
                                    <div className="flex items-end gap-2 flex-wrap md:flex-nowrap">
                                        <div className="w-20">
                                            <p className="text-xs text-gray-500 mb-1">ปี (YY)</p>
                                            <input type="text" name="idCodeYear" value={formData.idCodeYear} onChange={handleChange}
                                                className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-center font-mono font-bold focus:ring-2 focus:ring-blue-400 focus:outline-none"
                                                maxLength="2" required />
                                        </div>
                                        <div className="pb-2 text-gray-400 font-bold">-</div>
                                        <div className="flex-1 min-w-[120px]">
                                            <p className="text-xs text-gray-500 mb-1">รหัสประเภท (X-XX-XX)</p>
                                            <input type="text" name="idCodeCat" value={formData.idCodeCat} onChange={handleChange}
                                                className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-center font-mono font-bold focus:ring-2 focus:ring-blue-400 focus:outline-none"
                                                placeholder="1-13-01" required />
                                        </div>
                                        <div className="pb-2 text-gray-400 font-bold">/</div>
                                        <div className="w-24">
                                            <p className="text-xs text-gray-500 mb-1">ลำดับ (XXX)</p>
                                            <input type="text" name="idCodeSeq" value={formData.idCodeSeq} onChange={handleChange}
                                                className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-center font-mono font-bold focus:ring-2 focus:ring-blue-400 focus:outline-none"
                                                placeholder="001" maxLength="3" required />
                                        </div>
                                    </div>
                                    <div className="mt-2 text-center">
                                        <p className="text-xs text-blue-600">
                                            ตัวอย่างรหัส: <span className="font-bold bg-white px-2 py-0.5 rounded border border-blue-100">68-1-13-01/009</span>
                                        </p>
                                    </div>
                                </div>
                            )}

                            {/* Read-only ID for Edit Mode */}
                            {asset && (
                                <div className="mb-6">
                                    <label className="block text-gray-500 text-sm font-bold mb-1">รหัสพัสดุ</label>
                                    <div className="bg-gray-100 px-4 py-3 rounded-xl border border-gray-200 font-mono font-bold text-gray-600">
                                        {asset.id}
                                    </div>
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="md:col-span-2">
                                    <label className="label">ชื่อครุภัณฑ์</label>
                                    <input type="text" name="name" value={formData.name} onChange={handleChange} className="input-field" placeholder="ระบุชื่อเรียกอุปกรณ์" required />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="label">ยี่ห้อ / รุ่น / รายละเอียด</label>
                                    <input type="text" name="brand" value={formData.brand} onChange={handleChange} className="input-field" placeholder="เช่น Dell OptiPlex 7480" />
                                </div>

                                <div className="md:col-span-2">
                                    <label className="label text-teal-700">ผู้ครอบครอง (ชื่อ-นามสกุล)</label>
                                    <input type="text" name="holder" value={formData.holder} onChange={handleChange} className="input-field border-teal-200 bg-teal-50/30 focus:border-teal-400" placeholder="ระบุชื่อผู้ดูแลรับผิดชอบ" />
                                </div>

                                <div>
                                    <label className="label">หน่วยงาน</label>
                                    <input type="text" name="department" value={formData.department} onChange={handleChange} className="input-field" />
                                </div>

                                <div>
                                    <label className="label">สถานที่ตั้ง</label>
                                    <input type="text" name="location" value={formData.location} onChange={handleChange} className="input-field" />
                                </div>

                                <div>
                                    <label className="label">ปีงบประมาณ</label>
                                    <input type="text" name="purchaseYear" value={formData.purchaseYear} onChange={handleChange} className="input-field" placeholder="เช่น 2568" />
                                </div>

                                <div>
                                    <label className="label">สถานะประกัน</label>
                                    <select name="warrantyStatus" value={formData.warrantyStatus} onChange={handleChange} className="input-field">
                                        <option value="อยู่ในประกัน">อยู่ในประกัน</option>
                                        <option value="หมดประกัน">หมดประกัน</option>
                                        <option value="ไม่ทราบ">ไม่ทราบ</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="label">สถานะการใช้งาน</label>
                                    <select name="status" value={formData.status} onChange={handleChange} className="input-field">
                                        <option value="ปกติ">ปกติ</option>
                                        <option value="ชำรุด">ชำรุด</option>
                                        <option value="ส่งซ่อม">ส่งซ่อม</option>
                                        <option value="จำหน่าย">จำหน่าย</option>
                                        <option value="สูญหาย">สูญหาย</option>
                                    </select>
                                </div>

                                <div className="md:col-span-2">
                                    <label className="label">แนบรูป (ภาพครุภัณฑ์)</label>
                                    {!imagePreview ? (
                                        <div
                                            className={`w-full h-40 border-2 border-dashed rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300 bg-gray-50
                                                ${isImageDragging ? 'border-teal-500 bg-teal-50 scale-[1.01]' : 'border-gray-300 hover:bg-gray-100 hover:border-teal-400'}
                                            `}
                                            onDragOver={handleImageDragOver}
                                            onDragLeave={handleImageDragLeave}
                                            onDrop={handleImageDrop}
                                            onClick={() => imageInputRef.current?.click()}
                                        >
                                            <input
                                                ref={imageInputRef}
                                                id="assetImageInput"
                                                type="file"
                                                className="hidden"
                                                accept="image/png, image/jpeg, image/gif"
                                                onChange={handleImageInputChange}
                                            />
                                            <div className="w-16 h-16 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center mb-3 animate-bounce">
                                                <i className="ph-camera text-3xl"></i>
                                            </div>
                                            <p className="text-gray-600 font-bold">คลิกหรือวางรูปภาพ</p>
                                            <p className="text-gray-400 text-xs mt-1">PNG, JPG, GIF ไม่เกิน 10MB</p>
                                        </div>
                                    ) : (
                                        <div className="w-full bg-white border border-gray-200 rounded-2xl p-4 flex flex-col md:flex-row items-center gap-4 shadow-sm">
                                            <div className="w-24 h-24 rounded-xl overflow-hidden bg-gray-100 flex items-center justify-center border border-gray-100">
                                                <img src={imagePreview} alt="Preview" className="w-full h-full object-cover" />
                                            </div>
                                            <div className="flex-1 space-y-1 text-sm text-gray-700">
                                                <p className="font-bold text-gray-800">{imageFile?.name || 'ภาพครุภัณฑ์'}</p>
                                                <p className="text-xs text-gray-400">{imageFile ? `${(imageFile.size / 1024 / 1024).toFixed(2)} MB` : 'ไฟล์แนบที่บันทึกไว้'}</p>
                                            </div>
                                            <button
                                                type="button"
                                                onClick={handleRemoveImage}
                                                className="px-4 py-2 bg-red-50 text-red-600 rounded-xl text-xs font-semibold border border-red-100 hover:bg-red-100 transition"
                                            >
                                                ลบภาพ
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="flex gap-4 mt-8 pt-6 border-t border-gray-100">
                                <button type="button" onClick={onClose} className="flex-1 py-3 px-4 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200 font-semibold transition">
                                    ยกเลิก
                                </button>
                                <button
                                    type="submit"
                                    disabled={isSaving}
                                    className={`flex-1 py-3 px-4 bg-gradient-to-r from-teal-500 to-teal-400 text-white rounded-xl hover:shadow-lg hover:-translate-y-0.5 font-semibold transition-all ${isSaving ? 'opacity-70 cursor-not-allowed' : ''}`}
                                >
                                    {isSaving ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const AssetListView = ({ assets, onDeleteAsset, onCreateAsset, onUpdateAsset, tickets }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedAsset, setSelectedAsset] = useState(null);
            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [editingAsset, setEditingAsset] = useState(null);
            const [filterStatus, setFilterStatus] = useState('ทั้งหมด');
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [isBulkPrinting, setIsBulkPrinting] = useState(false);
            const [currentPage, setCurrentPage] = useState(1);
            const ITEMS_PER_PAGE = 10;

            const filteredAssets = assets.filter(asset => {
                const matchesSearch = asset.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    asset.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    asset.holder?.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesStatus = filterStatus === 'ทั้งหมด' || asset.status === filterStatus;
                return matchesSearch && matchesStatus;
            });

            const selectedCount = selectedIds.size;
            const selectedAssetsList = assets.filter(asset => selectedIds.has(asset.assetKey));
            const allFilteredSelected = filteredAssets.length > 0 && filteredAssets.every(asset => selectedIds.has(asset.assetKey));

            const totalPages = Math.max(1, Math.ceil(filteredAssets.length / ITEMS_PER_PAGE));
            const pagedAssets = filteredAssets.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);
            const limitedPagedAssets = pagedAssets.slice(0, ITEMS_PER_PAGE);
            const displayStart = limitedPagedAssets.length === 0 ? 0 : (currentPage - 1) * ITEMS_PER_PAGE + 1;
            const displayEnd = limitedPagedAssets.length === 0 ? 0 : displayStart + limitedPagedAssets.length - 1;

            useEffect(() => {
                setCurrentPage(1);
            }, [searchTerm, filterStatus, assets.length]);

            useEffect(() => {
                if (currentPage > totalPages) {

                return new Promise((resolve, reject) => {
                    if (!window?.QRCode) {
                        reject(new Error('ไม่พบไลบรารี QRCode'));
                        return;
                    }
                    const container = document.createElement('div');
                    container.style.position = 'absolute';
                    container.style.left = '-9999px';
                    document.body.appendChild(container);
                    new window.QRCode(container, {
                        text,
                        width: 220,
                        height: 220,
                        correctLevel: window.QRCode?.CorrectLevel?.H
                    });
                    setTimeout(() => {
                        const canvas = container.querySelector('canvas');
                        const dataUrl = canvas?.toDataURL('image/png');
                        document.body.removeChild(container);
                        if (dataUrl) {
                            resolve(dataUrl);
                        } else {
                            reject(new Error('ไม่สามารถสร้าง QR ได้'));

                    }, 100);
