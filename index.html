    .bg-hero {
      position: relative;
      isolation: isolate;
      background-color: #070a23;
      background-image:
        radial-gradient(1400px 620px at 50% 112%, rgba(0, 245, 255, 0.24) 0%, rgba(0, 245, 255, 0) 66%),
        radial-gradient(900px 420px at 50% -10%, rgba(199, 112, 255, 0.26) 0%, rgba(199, 112, 255, 0) 68%),
        radial-gradient(1000px 500px at 0% 35%, rgba(42, 130, 255, 0.24) 0%, rgba(42, 130, 255, 0) 65%),
        radial-gradient(1000px 500px at 100% 32%, rgba(168, 85, 247, 0.22) 0%, rgba(168, 85, 247, 0) 65%),
        linear-gradient(180deg, #0a0f35 0%, #070c2b 45%, #05081f 100%);
      animation: cyberGlow 8s ease-in-out infinite alternate;
    }
    .bg-hero::before,
    .bg-hero::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }
    .bg-hero::before {
      background:
        repeating-linear-gradient(to right, rgba(58, 208, 255, 0.16) 0, rgba(58, 208, 255, 0.16) 2px, transparent 2px, transparent 92px),
        repeating-linear-gradient(to bottom, rgba(194, 98, 255, 0.14) 0, rgba(194, 98, 255, 0.14) 2px, transparent 2px, transparent 92px);
      transform: perspective(900px) rotateX(62deg) scale(1.9) translateY(17%);
      transform-origin: center bottom;
      opacity: 0.42;
      animation: tunnelDrift 12s linear infinite;
    }
    .bg-hero::after {
      background:
        linear-gradient(115deg, transparent 22%, rgba(80, 220, 255, 0.8) 24%, rgba(80, 220, 255, 0.05) 32%, transparent 40%),
        linear-gradient(245deg, transparent 18%, rgba(219, 116, 255, 0.75) 20%, rgba(219, 116, 255, 0.05) 30%, transparent 38%),
        linear-gradient(0deg, rgba(0, 214, 255, 0.22), transparent 32%);
      mix-blend-mode: screen;
      opacity: 0.4;
      animation: neonSweep 7s ease-in-out infinite alternate;
    }
    @keyframes cyberGlow {
      0% { filter: saturate(1.02) brightness(0.92); }
      100% { filter: saturate(1.22) brightness(1.08); }
    }
    @keyframes tunnelDrift {
      0% { transform: perspective(900px) rotateX(62deg) scale(1.9) translateY(17%) translateX(0); }
      100% { transform: perspective(900px) rotateX(62deg) scale(1.9) translateY(17%) translateX(-46px); }
    }
    @keyframes neonSweep {
      0% { opacity: 0.28; filter: blur(0.5px); }
      100% { opacity: 0.52; filter: blur(1.4px); }
    }
    .main-wrap {

    .floaty { animation: float 18s ease-in-out infinite; }
    .action-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: linear-gradient(165deg, rgba(233, 245, 255, 0.9), rgba(219, 237, 255, 0.84));
      box-shadow: inset -8px -8px 16px rgba(255, 255, 255, 0.9),
                  inset 8px 8px 16px rgba(0, 0, 0, 0.06),
                  -12px -12px 22px rgba(255, 255, 255, 0.9),
                  12px 12px 22px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(110, 175, 255, 0.45);
    }
    .action-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(120deg, rgba(0, 229, 255, 0.95), rgba(94, 114, 255, 0.85), rgba(0, 229, 255, 0.95));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.55;
      pointer-events: none;
      animation: cyberEdgeGlow 2.8s ease-in-out infinite;
    }
    .action-card:hover {
      transform: translateY(-4px);
      box-shadow: inset -8px -8px 16px rgba(255, 255, 255, 0.95),
                  inset 8px 8px 16px rgba(0, 0, 0, 0.08),
                  -14px -14px 26px rgba(255, 255, 255, 0.95),
                  14px 14px 26px rgba(0, 0, 0, 0.12),
                  0 0 24px rgba(56, 189, 248, 0.42);
    }
    .action-card:hover::before {
      opacity: 0.9;
      animation-duration: 1.8s;
    }
    @keyframes cyberEdgeGlow {
      0% {
        filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.25)) drop-shadow(0 0 6px rgba(79, 70, 229, 0.2));
      }
      50% {
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.55)) drop-shadow(0 0 16px rgba(79, 70, 229, 0.5));
      }
      100% {
        filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.25)) drop-shadow(0 0 6px rgba(79, 70, 229, 0.2));
      }
    }
    .magnifier {
      width: 54px;
      height: 54px;
      border: 6px solid #6fd7b7;
      border-radius: 50%;
      position: relative;
      animation: float 0.9s ease-in-out infinite;
      background: #fff;
    }
    .magnifier::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 6px;
      background: #6fd7b7;
      border-radius: 4px;
      right: -16px;
      bottom: -6px;
      transform: rotate(45deg);
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }

      try {
        onReady(window.lottie || window.bodymovin || null);

        console.error('ensureLottieLibrary error', err);
        onReady(null);
      }
    }

    function mountLottie(containerId, animationData) {
      var container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';
      if (!animationData) {
        container.innerHTML = '<div style="font-size:24px;line-height:1">Loading...</div>';
        return;
      }
      ensureLottieLibrary(function(lottieLib) {
        if (!lottieLib) {
          container.innerHTML = '<div style="font-size:24px;line-height:1">Loading...</div>';
          return;
        }
        try {
          lottieLib.loadAnimation({
            container: container,
            renderer: 'svg',
            loop: true,
            autoplay: true,
            animationData: animationData,
            rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
          });
        } catch (err) {
          console.error('mountLottie error', err);
          container.innerHTML = '<div style="font-size:24px;line-height:1">Loading...</div>';
        }
      });
    }

    function normalizeAssetStatusClient(status) {
      const raw = String(status || '').trim();
      if (!raw) return 'ปกติ';
      const s = raw.toLowerCase();
      if (s.includes('ปกติ') || s.includes('ใช้งานได้') || s.includes('normal')) return 'ปกติ';
      if (s.includes('ชำรุด') || s.includes('damaged')) return 'ชำรุด';
      if (s.includes('ซ่อม') || s.includes('repair')) return 'ส่งซ่อม';
      if (s.includes('จำหน่าย') || s.includes('สูญหาย') || s.includes('disposed') || s.includes('lost') || s.includes('ซาก')) return 'จำหน่าย/สูญหาย';
      return raw;
    }

    function renderUserStatusBadge(status) {
      const s = normalizeAssetStatusClient(status);
      if (s === 'ปกติ') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">● ปกติ</span>';
      if (s === 'ส่งซ่อม') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700">● ส่งซ่อม</span>';
      if (s === 'ชำรุด') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-700">● ชำรุด</span>';
      return `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">● ${s || '-'}</span>`;
    }

    function normalizeUserCategory(item) {
      const direct = String((item && item.category) || '').trim();
      if (['คอมพิวเตอร์', 'กล้องวงจรปิด', 'โสตทัศนูปกรณ์', 'อุปกรณ์เครือข่าย'].includes(direct)) return direct;
      if (['อุปกรณ์จัดเก็บข้อมูล', 'อุปกรณ์พกพา'].includes(direct)) return 'คอมพิวเตอร์';
      if (['หน้าจอแสดงผล', 'ปริ้นเตอร์', 'เครื่องสำรองไฟ', 'โปรเจคเตอร์', 'โสตทัศนูปกรณ์', 'อื่นๆ'].includes(direct)) return 'โสตทัศนูปกรณ์';
      const text = `${direct} ${(item && item.assetName) || ''} ${(item && item.notes) || ''}`.toLowerCase();
      if (text.includes('กล้องวงจรปิด') || text.includes('cctv') || text.includes('camera')) return 'กล้องวงจรปิด';
      if (text.includes('router') || text.includes('switch') || text.includes('network') || text.includes('เครือข่าย')) return 'อุปกรณ์เครือข่าย';
      if (text.includes('คอม') || text.includes('computer') || text.includes('pc') || text.includes('desktop') || text.includes('notebook') || text.includes('laptop') || text.includes('tablet') || text.includes('ipad') || text.includes('mobile') || text.includes('storage') || text.includes('hdd') || text.includes('ssd')) return 'คอมพิวเตอร์';
      return 'โสตทัศนูปกรณ์';
    }

    function escapeTrackHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getTrackAssetKey(item) {
      if (!item) return '';
      const direct = String(item.assetKey || item.assetReferenceKey || '').trim();
      if (direct) return direct;
      const number = String(item.assetNumber || '').trim();
      const orgCode = String(item.assetOrgCode || '').trim();
      if (orgCode && number) return orgCode + ':' + number;
      return number;
    }

    function getTrackAssetDisplay(item) {
      const number = String((item && item.assetNumber) || '').trim() || '-';
      const org = String((item && (item.assetOrgName || item.assetOrgCode)) || '').trim();
      return org ? (org + ' / ' + number) : number;
    }

    function extractTrackKeyFromInput(raw) {
      const value = String(raw || '').trim();
      if (!value) return '';
      try {
        const url = new URL(value, window.location.href);
        const key = url.searchParams.get('k') || url.searchParams.get('key') || url.searchParams.get('assetKey');
        if (key) return decodeURIComponent(key).trim();
      } catch (err) {}
      const match = value.match(/[?&](?:k|key|assetKey)=([^&#]+)/i);
      if (match && match[1]) {
        try { return decodeURIComponent(match[1]).trim(); } catch (err) { return match[1].trim(); }
      }
      return value;
    }

    function resolveTrackAssetKey(raw, list) {
      const inputKey = extractTrackKeyFromInput(raw);
      if (!inputKey) return '';
      const normalized = inputKey.toLowerCase();
      const items = Array.isArray(list) ? list : [];
      const exact = items.find(function(item) {
        const key = getTrackAssetKey(item);
        const number = String(item.assetNumber || '').trim();
        const display = getTrackAssetDisplay(item);
        return String(key).toLowerCase() === normalized ||
          String(number).toLowerCase() === normalized ||
          String(display).toLowerCase() === normalized;
      });
      if (exact) return getTrackAssetKey(exact);
      if (inputKey.includes(':')) return inputKey;
      return '';
    }

    function openAssetDetailFromTrackValue(raw, list) {
      const key = resolveTrackAssetKey(raw, list);
      const hint = document.getElementById('trackHelpText');
      if (!key) {
        if (hint) hint.innerHTML = '<span class="text-rose-600 font-semibold">ไม่พบรหัสนี้ กรุณาเลือกจากตาราง Auto Complete หรือสแกน QR จากสติกเกอร์</span>';
        return;
      }
      window.location.href = 'asset.html?k=' + encodeURIComponent(key);
    }

    function bindStableAutocompleteDropdown(input, dropdown) {
      if (!input || !dropdown) return;
      let pointerInsideDropdown = false;
      let releaseTimer = null;
      const lockDropdown = () => {
        pointerInsideDropdown = true;
        dropdown.dataset.pointerInside = '1';
        if (releaseTimer) clearTimeout(releaseTimer);
      };
      const releaseDropdown = () => {
        if (releaseTimer) clearTimeout(releaseTimer);
        releaseTimer = setTimeout(() => {
          pointerInsideDropdown = false;
          dropdown.dataset.pointerInside = '0';
        }, 320);
      };
      dropdown.addEventListener('pointerdown', lockDropdown);
      dropdown.addEventListener('mousedown', lockDropdown);
      dropdown.addEventListener('touchstart', lockDropdown, { passive: true });
      document.addEventListener('pointerup', releaseDropdown);
      document.addEventListener('mouseup', releaseDropdown);
      document.addEventListener('touchend', releaseDropdown, { passive: true });
      document.addEventListener('touchcancel', releaseDropdown, { passive: true });
      input.addEventListener('blur', () => {
        setTimeout(() => {

    function normalizeBuddhistYearClient(year) {
      const y = Number(year);
      if (!Number.isFinite(y)) return NaN;
      return y >= 2400 ? y - 543 : y;
    }

    function normalizeLikelyThaiYearTypoClient(year, month, day) {
      const y = Number(year);
      const m = Number(month);
      const d = Number(day);
      if (!Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(d)) return y;
      if (y < 1900 || y > 1999) return y;

      const candidateBE = y + 600;
      const candidateAD = candidateBE - 543;
      const corrected = new Date(candidateAD, m - 1, d);
      if (corrected.getFullYear() !== candidateAD || corrected.getMonth() !== m - 1 || corrected.getDate() !== d) return y;

      const raw = new Date(y, m - 1, d);
      if (raw.getFullYear() !== y || raw.getMonth() !== m - 1 || raw.getDate() !== d) return y;

      const today = new Date();
      const latestAllowed = new Date(today.getFullYear() + 1, 11, 31);
      if (corrected.getTime() > latestAllowed.getTime()) return y;

      const rawAgeYears = (today.getTime() - raw.getTime()) / (1000 * 60 * 60 * 24 * 365.25);
      const correctedAgeYears = (today.getTime() - corrected.getTime()) / (1000 * 60 * 60 * 24 * 365.25);
      if (rawAgeYears >= 40 && correctedAgeYears >= 0 && correctedAgeYears <= 40) return candidateBE;
      return y;
    }

    function parseFlexibleDateClient(value) {
      if (value === null || value === undefined || value === '') return null;
      if (Object.prototype.toString.call(value) === '[object Date]') {
        if (Number.isNaN(value.getTime())) return null;
        const y = normalizeBuddhistYearClient(value.getFullYear());
        return new Date(y, value.getMonth(), value.getDate());
      }

      const text = String(value).trim();
      if (!text) return null;

      const m = text.match(/^(\d{1,4})[-\/.](\d{1,2})[-\/.](\d{1,4})(?:\s.*)?$/);
      if (m) {
        let year;
        let month;
        let day;
        if (m[1].length === 4) {
          month = Number(m[2]);
          day = Number(m[3]);
          year = normalizeLikelyThaiYearTypoClient(m[1], month, day);
          year = normalizeBuddhistYearClient(year);
        } else if (m[3].length === 4) {
          month = Number(m[2]);
          day = Number(m[1]);
          year = normalizeLikelyThaiYearTypoClient(m[3], month, day);
          year = normalizeBuddhistYearClient(year);
        } else {
          return null;
        }
        const d = new Date(year, month - 1, day);
        if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
        return d;
      }

      const parsed = new Date(text);
      if (Number.isNaN(parsed.getTime())) return null;
      const y = normalizeBuddhistYearClient(parsed.getFullYear());
      return new Date(y, parsed.getMonth(), parsed.getDate());
    }

    function formatThaiDate(value) {
      const date = parseFlexibleDateClient(value);
      if (!date) return value || '-';
      const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
      return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear() + 543}`;
    }

    function formatUsageAge(receivedDate) {
      if (!receivedDate) return '-';
      const d = parseFlexibleDateClient(receivedDate);
      if (!d || Number.isNaN(d.getTime())) return '-';
      const now = new Date();
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (end.getTime() < start.getTime()) return '0 วัน';

      let years = end.getFullYear() - start.getFullYear();
      let months = end.getMonth() - start.getMonth();
      let days = end.getDate() - start.getDate();

      if (days < 0) {
        const prevMonthLastDay = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
        days += prevMonthLastDay;
        months -= 1;
      }
      if (months < 0) {
        months += 12;
        years -= 1;
      }

      const totalDays = Math.floor((end.getTime() - start.getTime()) / (1000 * 60 * 60 * 24));
      if (years <= 0 && months <= 0) return `${totalDays} วัน`;
      if (years <= 0) return `${months} เดือน ${days} วัน`;
      return `${years} ปี ${months} เดือน`;
    }

              <div class="change-help-text">ค้นหาด้วยการพิมพ์ หรือสแกน QR จากสติกเกอร์ แล้วเลือกรายการจากตาราง Auto Complete</div>
              <div class="track-input-row">
                <div class="track-input-wrap">
                  <input id="changeAsset" class="swal2-input" placeholder="เช่น RPRP:50-1-13-01/39 หรือ 50-1-13-01/39" autocomplete="off">
                </div>
                <button id="scanBtn" class="track-scan-btn swal2-styled" type="button"><i class="fas fa-qrcode mr-2"></i>สแกน QR</button>
              </div>
              <div id="assetDropdown" class="track-dropdown-table change-dropdown-table"></div>

              <div id="changeSelectedSummary" class="change-selected-card is-hidden">
                <div id="changeSelectedTitle" class="change-selected-title">-</div>
                <div id="changeSelectedMeta" class="change-selected-meta">-</div>
              </div>

              <div class="change-form-grid">
                <div class="change-field">
                  <label for="changeFrom">ผู้รับผิดชอบปัจจุบัน</label>
                  <input id="changeFrom" class="swal2-input" placeholder="ผู้รับผิดชอบปัจจุบัน" readonly>
                </div>
                <div class="change-field">
                  <label for="changeCurrentLocation">สถานที่ใช้งานปัจจุบัน</label>
                  <input id="changeCurrentLocation" class="swal2-input" placeholder="สถานที่ใช้งานปัจจุบัน" readonly>
                </div>
                <div class="change-field">
                  <label for="changeTo">ผู้รับผิดชอบใหม่</label>
                  <input id="changeTo" class="swal2-input" placeholder="ผู้รับผิดชอบใหม่" autocomplete="off">
                </div>
                <div class="change-field">
                  <label for="changeNewLocation">ระบุสถานที่ใช้งานใหม่</label>
                  <input id="changeNewLocation" class="swal2-input" placeholder="เว้นว่างได้ ถ้าไม่เปลี่ยนสถานที่" autocomplete="off">
                </div>
                <div class="change-field change-field-full">
                  <label for="changeReason">เหตุผล/รายละเอียด</label>
                  <input id="changeReason" class="swal2-input" placeholder="เหตุผล/รายละเอียด" autocomplete="off">
                </div>
                <div class="change-field change-field-full">
                  <label for="changeContact">ผู้ติดต่อ / เบอร์โทร</label>
                  <input id="changeContact" class="swal2-input" placeholder="ผู้ติดต่อ / เบอร์โทร" autocomplete="off">
                </div>
              </div>
              <div class="change-note">คำขอจะเข้าสู่หลังบ้านเพื่อให้เจ้าหน้าที่อนุมัติ/ปฏิเสธก่อนอัปเดตข้อมูลจริง</div>
            </div>
          `,
          confirmButtonText: 'ส่งคำขอ',
          showCancelButton: true,
          cancelButtonText: 'ยกเลิก',
          showCloseButton: true,
          confirmButtonColor: '#0f766e',
          cancelButtonColor: '#e5e7eb',
          customClass: { popup: 'swal-change-upgrade' },
          didOpen: () => {
            const input = document.getElementById('changeAsset');
            const fromInput = document.getElementById('changeFrom');
            const currentLocationInput = document.getElementById('changeCurrentLocation');
            const newLocationInput = document.getElementById('changeNewLocation');
            const dropdown = document.getElementById('assetDropdown');
            const scanBtn = document.getElementById('scanBtn');
            const selectedBox = document.getElementById('changeSelectedSummary');
            const selectedTitle = document.getElementById('changeSelectedTitle');
            const selectedMeta = document.getElementById('changeSelectedMeta');
            let qrChange = null;
            let activeIndex = -1;
            let currentMatches = [];

            const setSelectedAsset = (asset) => {
              selectedAsset = asset || null;
              if (!selectedAsset) {
                fromInput.value = '';
                currentLocationInput.value = '';
                if (selectedBox) selectedBox.classList.add('is-hidden');
                return;
              }
              const display = getTrackAssetDisplay(selectedAsset);
              const assetKey = getTrackAssetKey(selectedAsset);
              input.value = display;
              fromInput.value = String(selectedAsset.owner || '').trim() || '-';
              currentLocationInput.value = String(selectedAsset.location || '').trim() || '-';
              if (!String(newLocationInput.value || '').trim()) {
                newLocationInput.value = '';
              }
              if (selectedTitle) selectedTitle.textContent = display;
              if (selectedMeta) {
                selectedMeta.textContent = [
                  selectedAsset.assetName || '-',
                  'รหัสอ้างอิง: ' + (assetKey || '-'),
                  'สถานะ: ' + normalizeAssetStatusClient(selectedAsset.status || '-')
                ].join(' • ');
              }
              if (selectedBox) selectedBox.classList.remove('is-hidden');
            };

            const renderDropdown = (value) => {
              const q = String(value || '').trim().toLowerCase();
              activeIndex = -1;
              currentMatches = [];
              if (!q) {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
                return;
              }
              currentMatches = list.filter(function(item) {
                return getChangeSearchText(item).includes(q);
              }).slice(0, 30);
              if (currentMatches.length === 0) {
                dropdown.innerHTML = '<div class="px-4 py-4 text-center text-sm text-rose-600">ไม่พบข้อมูลที่ตรงกับคำค้น</div>';
                dropdown.style.display = 'block';
                return;
              }
              dropdown.innerHTML = `
                <table>
                  <thead>
                    <tr>
                      <th>หน่วยงาน / หมายเลข</th>
                      <th>ชื่อครุภัณฑ์</th>
                      <th>สถานที่ใช้งานปัจจุบัน</th>
                      <th>ผู้รับผิดชอบปัจจุบัน</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${currentMatches.map(function(m, idx) {
                      return `
                        <tr data-index="${idx}" data-key="${escapeTrackHtml(getTrackAssetKey(m))}">
                          <td>
                            <div class="track-code-cell">${escapeTrackHtml(getTrackAssetDisplay(m))}</div>
                            <div class="track-muted-cell">${escapeTrackHtml(getTrackAssetKey(m))}</div>
                          </td>
                          <td>${escapeTrackHtml(m.assetName || '-')}</td>
                          <td>${escapeTrackHtml(m.location || '-')}</td>
                          <td>
                            <div>${escapeTrackHtml(m.owner || '-')}</div>
                            <div class="track-muted-cell"><span class="track-status-pill">● ${escapeTrackHtml(normalizeAssetStatusClient(m.status || '-'))}</span></div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              `;
              dropdown.style.display = 'block';
              Array.from(dropdown.querySelectorAll('tr[data-index]')).forEach(function(row) {
                row.addEventListener('mousedown', function(evt) {
                  evt.preventDefault();
                  const idx = Number(row.getAttribute('data-index'));
                  setSelectedAsset(currentMatches[idx]);
                  dropdown.style.display = 'none';
                });
              });
            };

            bindStableAutocompleteDropdown(input, dropdown);
            input.addEventListener('input', () => {
              selectedAsset = null;
              setSelectedAsset(null);
              renderDropdown(input.value);
            });
            input.addEventListener('focus', () => renderDropdown(input.value));
            input.addEventListener('keydown', (evt) => {
              if (!currentMatches.length || dropdown.style.display === 'none') {
                if (evt.key === 'Enter') {
                  const exact = findChangeAsset(input.value);
                  if (exact) {
                    evt.preventDefault();
                    setSelectedAsset(exact);
                    dropdown.style.display = 'none';
                  }
                }
                return;
              }
              if (evt.key === 'ArrowDown') {
                evt.preventDefault();
                activeIndex = Math.min(currentMatches.length - 1, activeIndex + 1);
              } else if (evt.key === 'ArrowUp') {
                evt.preventDefault();
                activeIndex = Math.max(0, activeIndex - 1);
              } else if (evt.key === 'Enter') {
                evt.preventDefault();
                if (activeIndex >= 0) {
                  setSelectedAsset(currentMatches[activeIndex]);
                  dropdown.style.display = 'none';
                }
              } else if (evt.key === 'Escape') {
                dropdown.style.display = 'none';
              }
              Array.from(dropdown.querySelectorAll('tr[data-index]')).forEach((row, idx) => {
                row.classList.toggle('is-active', idx === activeIndex);
              });
            });

            scanBtn.addEventListener('click', (e) => {
              e.preventDefault();
              const overlayId = 'qr-scan-overlay';
              let overlay = document.getElementById(overlayId);
              if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = overlayId;
                overlay.style.cssText = `
                  position: fixed;
                  inset: 0;
                  background: rgba(0,0,0,0.55);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  z-index: 9999;
                  padding: 16px;
                `;
                overlay.innerHTML = `
                  <div style="width: min(520px, 92vw); background:#fff; border-radius:20px; padding:16px; box-shadow:0 18px 45px rgba(0,0,0,0.22); text-align:center;">
                    <div style="font-weight:800; margin-bottom:10px; color:#243B35;">สแกน QR</div>
                    <div id="qrReader" style="width:100%;"></div>
                    <button id="qrCloseBtn" style="margin-top:12px; width:100%; height:44px; background:#6b7280; color:#fff; border-radius:12px; font-weight:700;">ปิดกล้อง</button>
                  </div>
                `;
                document.body.appendChild(overlay);
              }
              overlay.style.display = 'flex';

              const closeOverlay = () => {
                if (qrChange && qrChange.isScanning) {
                  qrChange.stop().then(() => qrChange.clear()).catch(() => {});
                }
                overlay.style.display = 'none';
              };

              if (!qrChange) {
                qrChange = new Html5Qrcode('qrReader');
              } else {
                qrChange.clear();
              }
              qrChange.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, (decodedText) => {
                const asset = findChangeAsset(decodedText);
                if (asset) {
                  setSelectedAsset(asset);
                  dropdown.style.display = 'none';
                } else {
                  input.value = extractTrackKeyFromInput(decodedText);
                  renderDropdown(input.value);
                }
                closeOverlay();
              }).catch(() => {});

              const closeBtn = document.getElementById('qrCloseBtn');
              closeBtn.addEventListener('click', (evt) => {
                evt.preventDefault();
                closeOverlay();
              }, { once: true });
            });
          },
          preConfirm: () => {
            const inputValue = document.getElementById('changeAsset').value.trim();
            const resolvedAsset = selectedAsset || findChangeAsset(inputValue);
            const fromOwner = document.getElementById('changeFrom').value.trim();
            const currentLocation = document.getElementById('changeCurrentLocation').value.trim();
            const toOwner = document.getElementById('changeTo').value.trim();
            const newLocation = document.getElementById('changeNewLocation').value.trim();
            const reason = document.getElementById('changeReason').value.trim();
            const contact = document.getElementById('changeContact').value.trim();

            if (!inputValue) {
              Swal.showValidationMessage('กรุณาระบุหรือเลือกครุภัณฑ์จากตาราง Auto Complete');
              return false;
            }
            if (!resolvedAsset) {
              Swal.showValidationMessage('กรุณาเลือกรายการครุภัณฑ์จากตาราง Auto Complete เพื่อป้องกันเลือกผิดรายการ');
              return false;
            }
            const currentOwnerValue = String((resolvedAsset.owner || fromOwner || '-')).trim() || '-';
            const currentLocationValue = String((resolvedAsset.location || currentLocation || '-')).trim() || '-';
            if (!toOwner) {
              Swal.showValidationMessage('กรุณากรอกผู้รับผิดชอบใหม่');
              return false;
            }
            if (currentOwnerValue !== '-' && currentOwnerValue === toOwner) {
              Swal.showValidationMessage('ผู้รับผิดชอบใหม่ต้องไม่ซ้ำผู้รับผิดชอบปัจจุบัน');
              return false;
            }
            if (!reason) {
              Swal.showValidationMessage('กรุณากรอกเหตุผล/รายละเอียด');
              return false;
            }
            if (!contact) {
              Swal.showValidationMessage('กรุณากรอกผู้ติดต่อ / เบอร์โทร');
              return false;
            }

            return {
              assetNumber: String(resolvedAsset.assetNumber || '').trim(),
              assetKey: getTrackAssetKey(resolvedAsset),
              assetOrgName: String(resolvedAsset.assetOrgName || '').trim(),
              assetName: String(resolvedAsset.assetName || '').trim(),
              fromOwner: currentOwnerValue,
              currentLocation: currentLocationValue,
              toOwner: toOwner,
              newLocation: newLocation,
              reason: reason,
              contact: contact,
              actor: localStorage.getItem('admin_user') || contact || 'user'
            };
          }
        }).then(result => {
          if (!result.isConfirmed) return;
          const payload = result.value;
          google.script.run.withSuccessHandler(function(res) {
            if (res && res.success) {
              Swal.fire({
                icon: 'success',
                title: 'ส่งคำขอแล้ว',
                text: 'เจ้าหน้าที่จะตรวจสอบและติดต่อกลับ',
                confirmButtonColor: '#10b981'
              });
            } else {
              Swal.fire({ icon: 'error', title: 'ส่งคำขอไม่สำเร็จ', text: res.message || '' });
            }
          }).saveChangeRequest(payload);
        });
      }).getSupplies();
    }

  </script>
</body>
</html>
